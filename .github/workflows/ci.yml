name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version from "packageManager"
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:manifests
      # importMap.js is generated (gitignored); typecheck needs it. / importMap.js do lệnh sinh ra (không commit), typecheck cần nó.
      - run: pnpm --filter @hosso/studio generate:importmap
        env: { HOSSO_SECRET: build-time-placeholder, HOSSO_DATABASE_URL: 'file:/tmp/build.db' }
      - run: pnpm typecheck
      - run: pnpm check:boundaries
      - run: pnpm check:i18n
      - run: pnpm test:kiln
      - run: pnpm test:editor-preview
      - run: pnpm test:canvas
      - run: pnpm test:studio-layout
      - run: pnpm test:editor-productivity
      - run: pnpm test:editor-canvas-upgrades
      - run: pnpm test:editor-design-tools
      - run: pnpm test:editor-design-workspace
      - run: pnpm test:editor-frames
      - run: pnpm test:form-delivery
      - run: node scripts/test-checkout-identity.mjs
      - run: node scripts/test-checkout-form.mjs
      - run: node scripts/test-order-receipt.mjs --shop-only
      - run: node scripts/test-order-origin.mjs
      - run: node scripts/test-commerce-security.mjs
      - run: node scripts/test-partner-connections.mjs
      - run: node scripts/test-shipping-workflow.mjs
      - run: pnpm test:cms-workspace
      - run: pnpm test:content-models
      - run: pnpm test:content-model-migration
      - run: pnpm test:cms-migration
      - run: pnpm test:site-package

  # Builds the image (includes `next build`) without pushing it. / Dựng image (đã gồm next build), không đẩy.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with: { context: ., push: false, cache-from: type=gha, cache-to: 'type=gha,mode=max' }

  # SQLite -> site package -> Postgres -> site package; the two packages must hold the same content.
  # SQLite -> gói site -> Postgres -> gói site; hai gói phải có cùng nội dung.
  roundtrip:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_PASSWORD: hosso, POSTGRES_DB: roundtrip }
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: node scripts/check-package-roundtrip.mjs
        env: { PG_URL: 'postgres://postgres:hosso@localhost:5432/roundtrip' }
      - run: node scripts/test-order-workflow-migration.mjs
        env: { COMMERCE_TEST_DATABASE_URL: 'postgres://postgres:hosso@localhost:5432/roundtrip' }
      - run: node scripts/test-partner-connections-migration.mjs
        env: { COMMERCE_TEST_DATABASE_URL: 'postgres://postgres:hosso@localhost:5432/roundtrip' }
