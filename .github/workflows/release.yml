name: Release image
# Tag v* -> image on GHCR, signed with cosign (keyless). The Kiln agent only accepts signed images.
# Tag v* -> image trên GHCR, ký bằng cosign (keyless). Agent của Kiln chỉ nhận image đã ký.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write
  id-token: write # keyless signing

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - id: build
        uses: docker/build-push-action@v6
        with: { context: ., push: true, tags: '${{ steps.meta.outputs.tags }}', labels: '${{ steps.meta.outputs.labels }}', cache-from: type=gha, cache-to: 'type=gha,mode=max' }
      - uses: sigstore/cosign-installer@v3
      - run: cosign sign --yes ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
